<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Your Shipment — FleetOS</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2e313a;
      --text: #e4e4e7;
      --text2: #9ca3af;
      --accent: #6366f1;
      --green: #22c55e;
      --blue: #3b82f6;
      --orange: #f59e0b;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1 span {
      color: var(--accent);
    }

    .subtitle {
      color: var(--text2);
      font-size: 13px;
      margin-bottom: 24px;
    }

    /* Token input */
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .search-box input {
      flex: 1;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .search-box button {
      padding: 12px 20px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }

    .error {
      color: #ef4444;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }

    /* Shipment card */
    .shipment-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: none;
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-header h2 {
      font-size: 16px;
    }

    .status-badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-badge.pending {
      background: #2a2416;
      color: var(--orange);
    }

    .status-badge.allocated {
      background: #1e2436;
      color: var(--blue);
    }

    .status-badge.picked_up,
    .status-badge.in_transit {
      background: #162916;
      color: var(--green);
    }

    .status-badge.delivered {
      background: #162929;
      color: #06b6d4;
    }

    .status-badge.cancelled {
      background: #2a1616;
      color: #ef4444;
    }

    .card-body {
      padding: 20px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    .info-item .label {
      font-size: 11px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .info-item .val {
      font-size: 15px;
      font-weight: 600;
      margin-top: 2px;
    }

    .eta-big {
      font-size: 28px;
      font-weight: 700;
      color: var(--green);
    }

    /* Progress bar */
    .progress-bar {
      display: flex;
      align-items: center;
      gap: 0;
      margin-bottom: 24px;
    }

    .progress-step {
      flex: 1;
      text-align: center;
      position: relative;
    }

    .progress-step .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--border);
      margin: 0 auto 4px;
      position: relative;
      z-index: 1;
    }

    .progress-step .dot.active {
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
    }

    .progress-step .dot.current {
      background: var(--blue);
      box-shadow: 0 0 10px var(--blue);
      animation: pulse 1.5s infinite;
    }

    .progress-step .step-label {
      font-size: 11px;
      color: var(--text2);
      font-weight: 600;
    }

    .progress-line {
      flex: 0.5;
      height: 3px;
      background: var(--border);
    }

    .progress-line.active {
      background: var(--green);
    }

    @keyframes pulse {

      0%,
      100% {
        box-shadow: 0 0 4px var(--blue);
      }

      50% {
        box-shadow: 0 0 14px var(--blue);
      }
    }

    /* Map */
    #track-map {
      height: 380px;
      border-radius: 8px;
      margin-top: 16px;
      border: 1px solid var(--border);
    }

    .leaflet-tile-pane {
      filter: saturate(0.3) brightness(0.7);
    }

    .leaflet-popup-content-wrapper {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .leaflet-popup-tip {
      background: var(--surface);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🚛 Fleet<span>OS</span> — Live Shipment Tracker</h1>
    <p class="subtitle">Real-time GPS visibility for clients and dispatchers</p>

    <div class="search-box">
      <input type="text" id="token-input" placeholder="Enter tracking token...">
      <button onclick="trackShipment()">Track Shipment</button>
    </div>
    <div class="error" id="track-error"></div>

    <div class="shipment-card" id="shipment-card">
      <div class="card-header">
        <h2 id="sc-cargo">-</h2>
        <span class="status-badge" id="sc-status">-</span>
      </div>
      <div class="card-body">
        <div class="progress-bar" id="progress-bar"></div>
        <div class="info-grid">
          <div class="info-item">
            <div class="label">Origin</div>
            <div class="val" id="sc-from">-</div>
          </div>
          <div class="info-item">
            <div class="label">Destination</div>
            <div class="val" id="sc-to">-</div>
          </div>
          <div class="info-item">
            <div class="label">Priority</div>
            <div class="val" id="sc-priority">-</div>
          </div>
          <div class="info-item">
            <div class="label">Estimated Time of Arrival</div>
            <div class="val eta-big" id="sc-eta">-</div>
          </div>
          <div class="info-item">
            <div class="label">Assigned Vehicle</div>
            <div class="val" id="sc-vehicle">-</div>
          </div>
          <div class="info-item">
            <div class="label">Live Vehicle Speed</div>
            <div class="val" id="sc-speed">-</div>
          </div>
        </div>
        <div id="track-map"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    let trackMap = null, vehicleMarker = null, originMarker = null, destMarker = null, routePolyline = null;
    let socket = null, currentVehicleId = null;

    // Read token from URL query param (?token=xyz) or hash (#xyz)
    const urlParams = new URLSearchParams(window.location.search);
    const queryToken = urlParams.get('token') || (location.hash ? location.hash.slice(1) : '');
    if (queryToken) {
      document.getElementById('token-input').value = queryToken;
      trackShipment();
    }

    document.getElementById('token-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        trackShipment();
      }
    });

    async function trackShipment() {
      const tkn = document.getElementById('token-input').value.trim();
      if (!tkn) return;

      const errEl = document.getElementById('track-error');
      errEl.style.display = 'none';

      try {
        const res = await fetch(`/api/v1/shipments/track/${encodeURIComponent(tkn)}`);
        const data = await res.json();
        if (!data.success) throw new Error(data.error?.message || 'Invalid or expired tracking token.');

        const s = data.data;
        document.getElementById('shipment-card').style.display = 'block';
        document.getElementById('sc-cargo').textContent = s.cargo_type + ' Cargo';
        const badge = document.getElementById('sc-status');
        badge.textContent = s.status.replace('_', ' ');
        badge.className = 'status-badge ' + s.status;
        document.getElementById('sc-from').textContent = s.origin_address;
        document.getElementById('sc-to').textContent = s.dest_address;
        document.getElementById('sc-priority').textContent = s.priority.toUpperCase();
        document.getElementById('sc-eta').textContent = s.eta_minutes ? s.eta_minutes + ' min' : (s.status === 'delivered' ? 'Completed' : 'Calculating...');
        document.getElementById('sc-vehicle').textContent = s.registration_no || 'Pending assignment';
        document.getElementById('sc-speed').textContent = s.vehicle_speed ? s.vehicle_speed.toFixed(0) + ' km/h' : '0 km/h';

        // Progress bar
        const steps = ['pending', 'allocated', 'picked_up', 'in_transit', 'delivered'];
        const currentIdx = steps.indexOf(s.status);
        const pb = document.getElementById('progress-bar');
        pb.innerHTML = steps.map((step, i) => {
          const dotClass = i < currentIdx ? 'active' : i === currentIdx ? 'current' : '';
          const lineClass = i < currentIdx ? 'active' : '';
          const label = step.replace('_', ' ');
          return (i > 0 ? `<div class="progress-line ${lineClass}"></div>` : '') +
            `<div class="progress-step"><div class="dot ${dotClass}"></div><div class="step-label">${label}</div></div>`;
        }).join('');

        // Leaflet Map Init
        if (!trackMap) {
          trackMap = L.map('track-map', { zoomControl: false }).setView([s.origin_lat, s.origin_lng], 10);
          L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            subdomains: 'abcd',
            attribution: '© OpenStreetMap © CARTO'
          }).addTo(trackMap);
          L.control.zoom({ position: 'topright' }).addTo(trackMap);
        }

        // Origin/Dest Markers
        if (originMarker) trackMap.removeLayer(originMarker);
        if (destMarker) trackMap.removeLayer(destMarker);
        originMarker = L.marker([s.origin_lat, s.origin_lng], { icon: makePin('#10b981', 'Origin') }).addTo(trackMap).bindPopup('Origin: ' + s.origin_address);
        destMarker = L.marker([s.dest_lat, s.dest_lng], { icon: makePin('#ef4444', 'Dest') }).addTo(trackMap).bindPopup('Destination: ' + s.dest_address);

        // Fetch & Draw Road Route Polyline via OSRM
        fetchOSRMRoute(s.origin_lat, s.origin_lng, s.dest_lat, s.dest_lng);

        // Vehicle Marker
        if (s.vehicle_lat && s.vehicle_lng) {
          if (vehicleMarker) trackMap.removeLayer(vehicleMarker);
          vehicleMarker = L.marker([s.vehicle_lat, s.vehicle_lng], { icon: makeTruck() }).addTo(trackMap).bindPopup('Vehicle: ' + (s.registration_no || 'Assigned Truck'));
          trackMap.fitBounds([[s.origin_lat, s.origin_lng], [s.dest_lat, s.dest_lng], [s.vehicle_lat, s.vehicle_lng]], { padding: [50, 50] });
        } else {
          trackMap.fitBounds([[s.origin_lat, s.origin_lng], [s.dest_lat, s.dest_lng]], { padding: [50, 50] });
        }

        // Subscribe to Scoped Vehicle Room over Socket.IO
        if (s.vehicle_id && s.vehicle_id !== currentVehicleId) {
          if (socket) socket.disconnect();
          socket = io({ transports: ['websocket', 'polling'] });
          socket.on('connect', () => {
            socket.emit('subscribe:vehicle', s.vehicle_id);
          });
          socket.on('vehicle:update', (d) => {
            if (d.vehicleId === s.vehicle_id && vehicleMarker) {
              vehicleMarker.setLatLng([d.lat, d.lng]);
              vehicleMarker.setPopupContent(`Vehicle ${s.registration_no || ''}<br>Speed: ${(d.speed || 0).toFixed(0)} km/h`);
              document.getElementById('sc-speed').textContent = (d.speed || 0).toFixed(0) + ' km/h';
            }
          });
          currentVehicleId = s.vehicle_id;
        }

        location.hash = tkn;
      } catch (e) {
        errEl.textContent = e.message;
        errEl.style.display = 'block';
        document.getElementById('shipment-card').style.display = 'none';
      }
    }

    async function fetchOSRMRoute(oLat, oLng, dLat, dLng) {
      try {
        const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${oLng},${oLat};${dLng},${dLat}?overview=full&geometries=geojson`);
        const data = await res.json();
        if (data.routes && data.routes.length > 0) {
          if (routePolyline) trackMap.removeLayer(routePolyline);
          routePolyline = L.geoJSON(data.routes[0].geometry, {
            style: { color: '#06b6d4', weight: 4, opacity: 0.85, dashArray: '6, 8' }
          }).addTo(trackMap);
        }
      } catch (e) {
        console.warn('OSRM polyline render fallback:', e);
      }
    }

    function makePin(color, label) {
      return L.divIcon({
        html: `<div style="width:20px;height:20px;background:${color};border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:bold;color:#fff;box-shadow:0 0 10px ${color}88;">${label[0]}</div>`,
        className: '', iconSize: [20, 20], iconAnchor: [10, 10]
      });
    }

    function makeTruck() {
      return L.divIcon({
        html: `<div style="width:28px;height:28px;background:#06b6d4;border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-size:12px;font-weight:900;box-shadow:0 0 12px #06b6d4;">▲</div>`,
        className: '', iconSize: [28, 28], iconAnchor: [14, 14]
      });
    }
  </script>
</body>

</html>
